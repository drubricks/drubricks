# Sidebar (menu "drubricks"): a section is a top-level link without a target
# (<nolink>), its screens are child links. options.icon: core Icon API;
# metadata.count: entity type whose records the user may see (the counter);
# metadata.color: icon colour token. Site builders reorder them in Menu UI.
drubricks_examples_crm.section:
  title: 'CRM'
  menu_name: drubricks
  route_name: '<nolink>'
  weight: 10
drubricks_examples_crm.contacts:
  title: 'Contacts'
  menu_name: drubricks
  parent: drubricks_examples_crm.section
  route_name: entity.crm_contact.collection
  weight: 0
  options:
    icon:
      pack_id: kit
      icon_id: i-users
  metadata:
    count: crm_contact
drubricks_examples_crm.companies:
  title: 'Companies'
  menu_name: drubricks
  parent: drubricks_examples_crm.section
  route_name: entity.crm_company.collection
  weight: 10
  options:
    icon:
      pack_id: kit
      icon_id: i-building
  metadata:
    count: crm_company
drubricks_examples_crm.deals:
  title: 'Deals'
  menu_name: drubricks
  parent: drubricks_examples_crm.section
  route_name: entity.crm_deal.drubricks_board
  weight: 20
  options:
    icon:
      pack_id: kit
      icon_id: i-dollar
  metadata:
    count: crm_deal
    color: green
# The deals as a chart (a View with the Chart format and exposed filters):
# the value per close month and stage.
drubricks_examples_crm.revenue:
  title: 'Revenue'
  menu_name: drubricks
  parent: drubricks_examples_crm.section
  route_name: entity.crm_deal.drubricks_chart
  weight: 30
  options:
    icon:
      pack_id: kit
      icon_id: i-chart
  metadata:
    color: teal
