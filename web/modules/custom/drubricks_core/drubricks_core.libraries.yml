# The shell behaviour: UI.init / UI.attach / UI.detach via Drupal.behaviors,
# navigation state after HTMX swaps, modal forms, messages, errors.
# The kit itself (window.UI) is provided by the active theme.
shell:
  js:
    js/shell.js: {}
  css:
    base:
      # Cascade layer order of the page (Tailwind v4 + the kit). Module CSS is
      # always aggregated before theme CSS, so the order is declared here.
      css/layers.css: { weight: -100 }
    component:
      css/shell.css: {}
  dependencies:
    - core/drupal
    - core/drupal.message
    - core/drupalSettings
    - core/once
    - core/drupal.htmx
    # The kit (kit/ui.js) is initialised when this script runs.
    - drubricks/global

# Brand look of the Gin Login pages (rendered in the admin theme).
login:
  css:
    theme:
      css/login.css: {}

# Board view island (BoardController).
