$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Mini card
status: stable
group: Detail view
description: 'Kit linked-record card (.mini): icon or letter tile, title and sub line. A link when url is set, a button otherwise.'
props:
  type: object
  required: [title]
  properties:
    title: { type: string, title: Title }
    subtitle: { type: string, title: Sub line }
    icon: { type: string, title: Icon }
    tile_color: { type: string, title: Colour token, description: "red, orange, yellow, green, teal, blue, indigo, purple, pink, gray", enum: ["", red, orange, yellow, green, teal, blue, indigo, purple, pink, gray] }
    url: { type: string, title: URL }
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Extra HTML attributes for the root element.
