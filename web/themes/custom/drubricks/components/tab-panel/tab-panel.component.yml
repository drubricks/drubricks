$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tab panel
status: stable
group: Tabs
description: 'Kit tab panel ([data-tab-panel]) inside the panels slot of drubricks:tabs. Hidden unless active; the kit adds role and aria-labelledby.'
props:
  type: object
  required: [id]
  properties:
    id: { type: string, title: Tab id }
    active: { type: boolean, title: Visible at first }
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Extra HTML attributes for the root element.
slots:
  content:
    title: Content
