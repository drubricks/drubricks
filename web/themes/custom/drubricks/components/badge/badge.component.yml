$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Badge
status: stable
group: Avatars, tags & badges
description: 'Kit count badge (.badge).'
props:
  type: object
  required: [count]
  properties:
    count: { type: [integer, string], title: Count }
    label: { type: string, title: Accessible label, description: 'e.g. "12 unread".' }
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Extra HTML attributes for the root element.
