$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Account button
status: stable
group: Sidebar
description: 'Kit account button (.sb-account) for the sidebar footer: avatar, name, a sub line, chevrons. The kit opens the account menu (UI.setAccountMenu). drubricks_core renders the real one from account menu plugins.'
props:
  type: object
  required: [name]
  properties:
    name: { type: string, title: Name }
    email: { type: string, title: Email (account menu header) }
    sub: { type: string, title: Sub line }
    footer: { type: boolean, title: Wrap in footer.sb-footer, default: true }
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Extra HTML attributes for the root element.
