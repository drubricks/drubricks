$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Icon button
status: stable
group: Buttons & controls
description: 'Kit icon-only button (.icon-btn). Needs a title (or tip): the kit mirrors it to aria-label.'
props:
  type: object
  required: [icon, title]
  properties:
    icon:
      type: string
      title: Icon
    title:
      type: string
      title: Title
      description: Accessible name and native tooltip. With tip set, the kit tooltip is used instead.
    size:
      type: string
      title: Size
      enum: [default, small]
      default: default
    'on':
      type: boolean
      title: Toggled on (.on)
    url:
      type: string
      title: URL
      description: Renders an <a> instead of a <button>.
    action:
      type: string
      title: Kit action
      description: 'data-action, e.g. toggle-sidebar, toggle-inspector, back.'
    disabled:
      type: boolean
      title: Disabled
    tip:
      type: string
      title: Tooltip
      description: Kit tooltip text (data-tip). Plain text.
    tip_kbd:
      type: string
      title: Tooltip shortcut
      description: Key cap shown in the tooltip (data-tip-kbd), e.g. ⌘K.
    tip_side:
      type: string
      title: Tooltip side
      enum: [top, bottom]
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Extra HTML attributes for the root element.
