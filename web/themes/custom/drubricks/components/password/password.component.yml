$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Password
status: stable
group: Forms
description: 'Kit password field: .input-group with a show / hide button, optional strength meter (.pw-meter, scored while typing) and a hint. Behaviour: password.js.'
props:
  type: object
  properties:
    value: { type: string, title: Value }
    placeholder: { type: string, title: Placeholder }
    meter: { type: boolean, title: Strength meter }
    score: { type: integer, title: Initial meter score (0–4), minimum: 0, maximum: 4 }
    autocomplete: { type: string, title: Autocomplete, default: current-password }
    name: { type: string, title: Name }
    id: { type: string, title: Id }
    required: { type: boolean, title: Required }
    disabled: { type: boolean, title: Disabled }
    invalid: { type: boolean, title: Invalid (aria-invalid) }
    label: { type: string, title: Label, description: Shown above the control (inside a .form it uses the kit label style). }
    hint: { type: string, title: Hint (.field-hint) }
    error: { type: string, title: Error message (.field-error), description: Also marks the control invalid. }
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
      description: Extra HTML attributes for the root element.
libraryOverrides:
  dependencies:
    - drubricks/global
